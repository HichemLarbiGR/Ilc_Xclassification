<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" font-family="Helvetica, Arial, DejaVu Sans, sans-serif">
<title>AttentionMIL architecture</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
</defs>
<rect width="680" height="660" fill="#ffffff"/>

<rect x="380" y="211" width="260" height="249" rx="20" fill="#F2F2F2" stroke="#111" stroke-width="2.5"/>
<text x="510" y="480" text-anchor="middle" dy=".35em" font-size="14" fill="#111">Gated attention</text>

<text x="250" y="16" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111">Logits (2 classes)</text>
<line x1="250" y1="44" x2="250" y2="28" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="150" y="44" width="200" height="36" rx="8" fill="#DCDDF0" stroke="#111" stroke-width="2.5"/>
<text x="250" y="62" text-anchor="middle" dy=".35em" font-size="15" fill="#111">Linear 64 → 2</text>

<line x1="250" y1="106" x2="250" y2="82" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="150" y="106" width="200" height="52" rx="8" fill="#FAD4C0" stroke="#111" stroke-width="2.5"/>
<text x="250" y="124" text-anchor="middle" dy=".35em" font-size="15" fill="#111">Weighted sum</text>
<text x="250" y="142" text-anchor="middle" dy=".35em" font-size="12" fill="#333">1 profile per slide</text>

<line x1="250" y1="182" x2="250" y2="160" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="250" cy="194" r="12" fill="#fff" stroke="#111" stroke-width="2.5"/>
<text x="250" y="194" text-anchor="middle" dy=".35em" font-size="16" fill="#111">×</text>

<path d="M510 233 L510 194 L264 194" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="390" y="182" text-anchor="middle" dy=".35em" font-size="12" fill="#333">a: weights, sum = 1</text>

<rect x="430" y="233" width="160" height="40" rx="8" fill="#C8E8D0" stroke="#111" stroke-width="2.5"/>
<text x="510" y="253" text-anchor="middle" dy=".35em" font-size="15" fill="#111">Softmax</text>
<line x1="510" y1="293" x2="510" y2="275" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="420" y="293" width="180" height="36" rx="8" fill="#FFE0B8" stroke="#111" stroke-width="2.5"/>
<text x="510" y="311" text-anchor="middle" dy=".35em" font-size="15" fill="#111">Linear → 1 score</text>
<line x1="510" y1="346" x2="510" y2="331" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="510" cy="358" r="12" fill="#fff" stroke="#111" stroke-width="2.5"/>
<text x="510" y="358" text-anchor="middle" dy=".35em" font-size="16" fill="#111">×</text>
<path d="M446 388 L446 358 L498 358" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M574 388 L574 358 L522 358" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="392" y="388" width="108" height="44" rx="8" fill="#FFE0B8" stroke="#111" stroke-width="2.5"/>
<text x="446" y="403" text-anchor="middle" dy=".35em" font-size="15" fill="#111">Linear V</text>
<text x="446" y="420" text-anchor="middle" dy=".35em" font-size="12" fill="#333">+ tanh</text>
<rect x="520" y="388" width="108" height="44" rx="8" fill="#FFE0B8" stroke="#111" stroke-width="2.5"/>
<text x="574" y="403" text-anchor="middle" dy=".35em" font-size="15" fill="#111">Linear U</text>
<text x="574" y="420" text-anchor="middle" dy=".35em" font-size="12" fill="#333">+ sigmoid</text>
<path d="M250 448 L446 448 L446 434" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M250 448 L574 448 L574 434" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>

<line x1="250" y1="476" x2="250" y2="206" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="250" cy="448" r="4" fill="#111"/>
<text x="262" y="330" dy=".35em" font-size="12" fill="#333">h: n × 64</text>

<rect x="150" y="476" width="200" height="44" rx="8" fill="#BDE6F7" stroke="#111" stroke-width="2.5"/>
<text x="250" y="491" text-anchor="middle" dy=".35em" font-size="15" fill="#111">Encoder</text>
<text x="250" y="507" text-anchor="middle" dy=".35em" font-size="12" fill="#333">Linear · ReLU · Dropout</text>
<line x1="250" y1="552" x2="250" y2="522" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="150" y="552" width="200" height="40" rx="8" fill="#FBDDE0" stroke="#111" stroke-width="2.5"/>
<text x="250" y="572" text-anchor="middle" dy=".35em" font-size="15" fill="#111">LayerNorm</text>
<line x1="250" y1="616" x2="250" y2="594" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250" y="632" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111">Patches (n × 1536)</text>
</svg>
